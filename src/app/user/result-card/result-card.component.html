<div class="border border-[#ccc] border-solid rounded-[7px] p-4 my-[0.7rem]">
  <div class="text-xl">
    <div class="flex pb-2.3 justify-between">
      <h2 class="font-bold text-[14px] sm:text-[18px] md:text-[16px] lg:text-[20px] mb-3">{{ card.title }}</h2>

    </div>

    <div class="pb-1">
      <div class="text-sm">Results: {{ card.correct_answer }} / {{ card.quantity }}</div>
      <div class="text-sm">Percentage of correct answers: {{ card.percent }}%</div>
      <div class="text-sm">Used time: {{ card.time }}</div>
    </div>
    <h2 class="text-sm text-right">{{ card.date | date }}</h2>
  </div>
</div>
